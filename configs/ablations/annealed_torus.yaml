# Ablation: annealed_torus
# Variante para avaliar emergencia topologica sem depender sempre da loss toroidal explicita.

# --- Modelo ---
vocab_size: 50000
d_model: 64
n_heads: 2
n_layers: 4
d_ff: 256
max_seq_len: 256
dropout: 0.1
bias: false

# --- Dados ---
data_dir: data/baseline/train
eval_data_dir: data/baseline/val

# --- Treino ---
batch_size: 16
learning_rate: 0.001
warmup_steps: 100
total_tokens: 10_000_000
mixed_precision: none
gradient_accumulation_steps: 1

# --- Avaliacao ---
eval_interval: 200
early_stop_patience: 10

# --- Manifold DRM ---
d_manifold: 4
metric_hidden: 16
metric_rank: 4
n_quad: 0

# --- Gamma-Scaling ---
gamma_enabled: true
gamma_c: 2.0
gamma_alpha: 1.0

# --- Gravidade ---
gravity_enabled: true
gravity_strength: 0.1
gravity_n_rff: 64
n_anchors: 6

# --- Dimensionalidade variavel ---
variable_dim: true

# --- Losses DRM ---
lambda_metric_reg: 0.001
lambda_metric_diversity: 0.01
lambda_ortho: 0.01
lambda_manifold_variance: 0.05
target_manifold_std: 0.08
lambda_intrinsic_dim: 0.02
target_intrinsic_dim: 2.0
lambda_coverage: 0.02
target_coverage_std: 0.20
lambda_torus: 0.07
lambda_torus_start: 0.07
lambda_torus_end: 0.0
torus_target_radius: 0.35
torus_radial_weight: 1.0
torus_coverage_weight: 0.25
torus_isotropy_weight: 0.5
torus_independence_weight: 0.5
torus_harmonic_weight: 0.5
geometry_warmup_steps: 500
geometry_schedule_start_step: 500
geometry_schedule_end_step: 2441
metric_diversity_warmup_steps: 500
target_metric_var: 0.001

# --- Checkpointing ---
save_dir: checkpoints/ablations/annealed_torus
save_interval: 200
save_total_limit: 3
log_interval: 10
temperature_min: 0.5
