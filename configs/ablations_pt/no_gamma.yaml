# Ablation PT: sem gamma-scaling

vocab_size: 50000
d_model: 20
n_heads: 2
n_layers: 2
d_ff: 80
max_seq_len: 256
dropout: 0.1
bias: false

data_dir: data/multilingual_pt/train
eval_data_dir: data/multilingual_pt/val
data_max_tokens: 1_000_000

batch_size: 16
learning_rate: 0.001
warmup_steps: 100
total_tokens: 1_000_000
mixed_precision: none
gradient_accumulation_steps: 1
num_workers: 0
eval_num_workers: 0

eval_interval: 100
early_stop_patience: 10

d_manifold: 4
metric_hidden: 8
metric_rank: 2
n_quad: 0

gamma_enabled: false

gravity_enabled: true
gravity_strength: 0.1
gravity_n_rff: 64
n_anchors: 6

variable_dim: true

lambda_metric_reg: 0.001
lambda_metric_diversity: 0.01
lambda_ortho: 0.01
metric_diversity_warmup_steps: 100
target_metric_var: 0.001

save_dir: checkpoints/ablations_pt_1m/no_gamma
save_interval: 100
save_total_limit: 3
log_interval: 20
temperature_min: 0.5
