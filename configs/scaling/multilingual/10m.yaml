# ~10M params - GPU consumer [multilingual o200k_base 50K]
vocab_size: 50000
d_model: 160
n_heads: 4
n_layers: 6
d_ff: 640
max_seq_len: 512
dropout: 0.1
bias: false
batch_size: 8
learning_rate: 0.0006
warmup_steps: 500
total_tokens: 200_000_000
mixed_precision: bf16
gradient_accumulation_steps: 4
eval_interval: 500
early_stopping_patience: 5

# --- Manifold DRM ---
d_manifold: 6
metric_hidden: 24
metric_rank: 4
n_quad: 0

# --- Gamma-Scaling ---
gamma_enabled: true
gamma_c: 2.83

# --- Gravidade ---
gravity_enabled: true
gravity_strength: 0.1
gravity_n_rff: 64
n_anchors: 6

# --- Dimensionalidade variavel ---
variable_dim: true

# --- Losses DRM ---
lambda_metric_reg: 0.001
lambda_metric_diversity: 0.03
lambda_ortho: 0.01
metric_diversity_warmup_steps: 2500
lambda_manifold_variance: 0.05
target_manifold_std: 0.08
lambda_intrinsic_dim: 0.0
target_intrinsic_dim: 2.0
lambda_coverage: 0.0
target_coverage_std: 0.20
lambda_torus: 0.02
lambda_torus_start: 0.02
lambda_torus_end: 0.02
torus_target_radius: 0.35
torus_radial_weight: 1.0
torus_coverage_weight: 0.25
torus_isotropy_weight: 0.5
torus_independence_weight: 0.5
torus_harmonic_weight: 0.5
geometry_warmup_steps: 2500
geometry_schedule_start_step: 0
geometry_schedule_end_step: 0
save_dir: checkpoints/multilingual_10m/run_1
save_interval: 500
log_interval: 50
target_metric_var: 0.001
save_total_limit: 5
temperature_min: 0.5